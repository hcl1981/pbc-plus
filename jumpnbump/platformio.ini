; ============================================================
;  Jump 'n Bump  -  zwei PicoBoy Color Plus, gekoppelt ueber USB
;  (RP2350, 16 MB Flash)
;
;  EINE Firmware fuer beide Geraete. Die USB-Rolle wird ZUR LAUFZEIT
;  im Startmenue gewaehlt:
;     "HOST" -> nativer USB-Host   (rechnet die Spielmechanik)
;     "JOIN" -> nativer USB-Device (CDC)
;  Moeglich durch die Dual-Role-tusb_config in include/ - Device- und
;  Host-Stack sind gleichzeitig einkompiliert, die Rolle wird erst nach
;  der Menueauswahl gestartet.
;
;  Verkabelung: USB-C <-> USB-C. D+/D-/GND verbinden.
;  VBUS NICHT verbinden (beide Geraete sind eigenversorgt).
;
;  Assets neu erzeugen (nur noetig, wenn data-src/ geaendert wird):
;      python3 tools/convert_assets.py
;
;  Bauen:  pio run   ->  .pio/build/picoboy_color_plus/firmware.uf2
; ============================================================

[env:picoboy_color_plus]
; Version FESTGENAGELT - kein automatisches Nachrutschen. Grund:
; tools/patch_tinyusb.py korrigiert Dateien IM Framework-Paket und
; muss zur Framework-Version passen.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#bd6fb6a
; Platform-Commit FESTGENAGELT statt HEAD. Der Kern soll Arduino-Pico 5.6.1
; bleiben, weil tools/patch_tinyusb.py Dateien IM Framework-Paket korrigiert
; und zur Version passen muss. bd6fb6a (26.06.2026) ist genau der Stand
; "Update to Arduino-Pico 5.6.1"; er waehlt auch die dazugehoerige
; Werkzeugkette (pqt-gcc 4.1.0) aus.
;
; Warum nicht mehr wie frueher nur das Framework pinnen: platform zeigte auf
; HEAD und ist inzwischen auf Arduino-Pico 6.0.0 weitergezogen. Dessen neuere
; Werkzeugkette (pqt-gcc 5.0.0) uebersetzt den 5.6.1-Kern nicht mehr --
; "'__getreent' was not declared in this scope" in malloc-lock.cpp.
framework = arduino
board = rpipico2                        ; RP2350 (ARM)
board_build.core = earlephilhower

; pre:  spielt patches/*.c vor JEDEM Build ins TinyUSB des Frameworks ein
;       (behebt u.a. eine Endlosschleife im USB-Interrupt)
; post: legt die fertige Firmware als jumpnbump.uf2 in die Projektwurzel
extra_scripts =
    pre:tools/patch_tinyusb.py
    post:tools/copy_uf2.py

board_upload.maximum_size = 16777216    ; 16 MB Gesamt-Flash
board_build.filesystem_size = 0m        ; kein LittleFS noetig -> alles fuer den Sketch

monitor_speed = 115200

build_flags =
    -O2
    -DUSE_TINYUSB
    -I include
    -DCFG_TUSB_CONFIG_FILE='"tusb_config_dualrole.h"'

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
