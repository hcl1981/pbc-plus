; ============================================================
;  i2collection  -  USB-Variante (Kommunikation ueber D+/D-)
;  PicoBoy Color Plus (RP2350, 16 MB Flash)
;
;  EINE Firmware fuer beide Rollen. Die USB-Rolle wird ZUR LAUFZEIT
;  im Menue gewaehlt:
;     Menue "HOST"  -> nativer USB-Host
;     Menue "JOIN"  -> nativer USB-Device (CDC)
;  Ermoeglicht durch eigene Dual-Role tusb_config
;  (include/tusb_config_dualrole.h) -> Device + Host gleichzeitig
;  einkompiliert, Rollen-Init nach der Menue-Auswahl.
;
;  Verkabelung: USB-C <-> USB-C. D+/D-/GND verbinden.
;  VBUS NICHT verbinden (beide Geraete eigenversorgt).
;
;  Bauen:  pio run          ->  .pio/build/picoboy_color_plus/firmware.uf2
; ============================================================

[env:picoboy_color_plus]
; Version FESTGENAGELT - kein automatisches Nachrutschen auf neuere Staende.
; Grund: tools/patch_tinyusb.py korrigiert eine Datei IM Framework-Paket
; (TinyUSB-Treiber). Der Patch wird zwar vor jedem Build neu eingespielt,
; muss aber zur Framework-Version passen.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#bd6fb6a
; Platform-Commit FESTGENAGELT statt HEAD. Der Kern soll Arduino-Pico 5.6.1
; bleiben, weil tools/patch_tinyusb.py Dateien IM Framework-Paket korrigiert
; und zur Version passen muss. bd6fb6a (26.06.2026) ist genau der Stand
; "Update to Arduino-Pico 5.6.1"; er waehlt auch die dazugehoerige
; Werkzeugkette (pqt-gcc 4.1.0) aus.
;
; Warum nicht mehr wie frueher nur das Framework pinnen: platform zeigte auf
; HEAD und ist inzwischen auf Arduino-Pico 6.0.0 weitergezogen. Dessen neuere
; Werkzeugkette (pqt-gcc 5.0.0) uebersetzt den 5.6.1-Kern nicht mehr --
; "'__getreent' was not declared in this scope" in malloc-lock.cpp.
framework = arduino
board = rpipico2                        ; RP2350 (ARM)
board_build.core = earlephilhower

; Lokaler TinyUSB-Fork: spielt patches/dcd_rp2040.c vor JEDEM Build ein.
; Behebt eine Endlosschleife im USB-Interrupt, die den ganzen Chip anhielt.
extra_scripts = pre:tools/patch_tinyusb.py

board_upload.maximum_size = 16777216    ; 16 MB Gesamt-Flash
board_build.filesystem_size = 4m        ; LittleFS 4 MB -> ~12 MB Sketch

monitor_speed = 115200

build_flags =
    -O2
    -DUSE_TINYUSB
    -I include
    -DCFG_TUSB_CONFIG_FILE='"tusb_config_dualrole.h"'

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BusIO
